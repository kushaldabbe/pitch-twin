[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitchtwin"
version = "0.0.1"
description = "Real-time 3D digital-twin of a football match, reconstructed from 2D broadcast video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PitchTwin" }]
dependencies = [
    "jsonschema>=4.20",
    "numpy>=1.24",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy CV stack. NOTE: torch must be installed separately with the CUDA index:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
cv = [
    "ultralytics>=8.2",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "supervision>=0.21",
    "tqdm>=4.66",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.scripts]
pitchtwin = "pitchtwin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchtwin"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/pitchtwin.frame.v1.json" = "pitchtwin/contract/pitchtwin.frame.v1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
